name: drugs_ng
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 0.1.3+1

environment:
  sdk: ^3.7.0

dependencies:
  cached_network_image: ^3.4.1
  custom_refresh_indicator: ^4.0.1
  dio: ^5.8.0+1
  dio_cache_interceptor: ^4.0.5
  dotted_border: ^2.1.0
  dropdown_button2: ^2.3.9
  either_dart: ^1.0.0
  equatable: ^2.0.7
  expandable: ^5.0.1
  file_picker: null
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_carousel_widget: ^3.1.0
  flutter_countdown_timer: ^4.1.0
  flutter_dotenv: ^5.2.1
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_styled_toast: ^2.2.1
  flutter_svg: ^2.0.17
  get_it: ^9.2.1
  geolocator: ^13.0.2
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  loader_overlay: ^5.0.0
  intl: ^0.20.2
  mime: ^2.0.0
  multi_value_listenable_builder: ^0.0.2
  page_transition: ^2.2.1
  path_provider: ^2.1.5
  persistent_bottom_nav_bar_v2: ^5.3.1
  phonecodes: ^0.0.4
  pin_code_fields: ^8.0.1
  readmore: ^3.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  flutter_spinkit: ^5.2.2

dev_dependencies:
  build_runner: ^2.14.1
  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.14.1
  flutter_test:
    sdk: flutter
  # hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/svg/
    - assets/json/
    - .env

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900
